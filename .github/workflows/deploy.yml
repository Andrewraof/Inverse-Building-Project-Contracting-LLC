name: Deploy Odoo addon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inverse-odoo-production
  cancel-in-progress: false

jobs:
  odoo-tests:
    uses: ./.github/workflows/odoo-meta-tests.yml

  validate-and-deploy:
    needs: odoo-tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate addon
        run: |
          python3 -m unittest discover -s tests -v
          python3 deploy/validate_addon.py hvac_sales_extension
          python3 deploy/validate_addon.py crm_meta_lead_ads

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inverse_deploy
          chmod 600 ~/.ssh/inverse_deploy
          cat >> ~/.ssh/known_hosts <<'EOF'
          178.104.53.152 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFiRnXsbg+YifWHBA9IMn5/SN9Ie3bEsJ0SMGgTDkR0R
          EOF

      - name: Bootstrap deployer and deploy exact commit
        run: |
          set +e
          ssh -i ~/.ssh/inverse_deploy \
            -o IdentitiesOnly=yes \
            deploy@178.104.53.152 \
            "sudo /usr/local/sbin/deploy-inverse-odoo '${GITHUB_SHA}'" 2>&1 | tee "$RUNNER_TEMP/deployer-bootstrap.log"
          bootstrap_status=${PIPESTATUS[0]}
          set -e
          if [[ "$bootstrap_status" -ne 0 ]]; then
            # Only retry a self-refreshing OLD deployer after its safe rollback.
            # The next step uses the new deployer and MUST succeed.
            grep -q "Refreshed /usr/local/sbin/deploy-inverse-odoo" "$RUNNER_TEMP/deployer-bootstrap.log"
            grep -q "starting rollback" "$RUNNER_TEMP/deployer-bootstrap.log"
            grep -q "Database backups, when created, are retained" "$RUNNER_TEMP/deployer-bootstrap.log"
            ssh -i ~/.ssh/inverse_deploy -o IdentitiesOnly=yes \
              deploy@178.104.53.152 "systemctl is-active --quiet odoo19.service"
          fi

      - name: Deploy exact commit with refreshed deployer
        run: |
          ssh -i ~/.ssh/inverse_deploy \
            -o IdentitiesOnly=yes \
            deploy@178.104.53.152 \
            "sudo /usr/local/sbin/deploy-inverse-odoo '${GITHUB_SHA}'"
